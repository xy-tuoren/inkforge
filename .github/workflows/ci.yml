name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke test (offline demo + audit)
        run: |
          inkforge genres
          inkforge audit examples/sample_ai_slop_chapter.txt --genre suspense
          inkforge audit examples/sample_human_craft_chapter.txt --genre suspense
          inkforge demo --genre suspense --chapters 1
